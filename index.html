<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me talking about random shit</title>
    <style>
        :root {
            --bg-color: #f4f4f0;
            --text-color: #1a1a1a;
            --accent-color: #2e6930;
            --border-color: #d1d1c7;
        }

        body {
            font-family: monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        /* Dial-up Loader Overlay */
        #dialup-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: monospace;
            transition: opacity 0.5s ease;
        }

        .loader-content {
            text-align: center;
            max-width: 400px;
        }

        .progressive-image-container {
            width: 300px;
            height: 450px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            background: #111;
            border: 1px solid #333;
        }

        .progressive-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: inset(0 0 100% 0);
            animation: loadLines 4s steps(40, end) forwards;
        }

        @keyframes loadLines {
            0% { clip-path: inset(0 0 100% 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        .status-text {
            font-size: 0.85rem;
            margin-top: 10px;
            color: #00aa00;
        }

        #main-site {
            display: none;
        }

        header {
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
        }

        article {
            margin-bottom: 40px;
        }

        .post-date {
            font-size: 0.85rem;
            color: #666;
        }

        h2 {
            font-size: 1.2rem;
            margin: 5px 0 15px 0;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 60px;
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="dialup-loader">
        <div class="loader-content">
            <p>CONNECT 56000/V.90</p>
            <div class="progressive-image-container">
                <img src="1000041333.png" alt="Loading Transmission...">
            </div>
            <div class="status-text" id="status-log">Receiving packet 1 of 42...</div>
        </div>
    </div>

    <div id="main-site">
        <header>
            <h1>Me talking about random shit</h1>
            <p>Unfiltered logs and late-night thoughts.</p>
        </header>
