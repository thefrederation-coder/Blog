<!-- FILE: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1: The Curiosity Shop Portal // reallifetalkblog.com</title>
    <meta name="description" content="Welcome to the Modern Worldly Curiosity Shop. Featuring surreal cabinet door transitions leading directly into candidate profiles.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://reallifetalkblog.com/">

    <style>
        :root {
            --gov-black: #0b0c0c;
            --ikea-blue: #0051ba;
            --ikea-yellow: #ffcc00;
            --wood-tone: #8B5A2B;
            --wood-dark: #5c3a21;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--gov-black);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Cabinet Door Transition Overlay (Closed by default on Page 1) */
        .cabinet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            z-index: 999;
            pointer-events: none;
        }
        .cabinet-door {
            width: 50vw;
            height: 100vh;
            background-color: var(--wood-tone);
            border: 4px solid var(--wood-dark);
            position: relative;
            transform: rotateY(0deg);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
        }
        .cabinet-door.left {
            transform-origin: left;
            border-right: 8px solid var(--wood-dark);
        }
        .cabinet-door.right {
            transform-origin: right;
            border-left: 8px solid var(--wood-dark);
        }

        /* Stock Video Feed inside the Cabinet Doors */
        .cabinet-door video {
            position: absolute;
            top: 0;
            left: 0;
            width: 200vw;
            height: 100vh;
            object-fit: cover;
            filter: contrast(200%) brightness(70%) hue-rotate(140deg) sepia(60%) invert(20%);
            mix-blend-mode: overlay;
            opacity: 0.65;
        }
        .cabinet-door.right video {
            left: -100vw;
        }

        .cabinet-handle {
            position: absolute;
            top: 50%;
            width: 15px;
            height: 80px;
            background: #d4af37;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            transform: translateY(-50%);
            z-index: 5;
        }
        .left .cabinet-handle { right: 20px; }
        .right .cabinet-handle { left: 20px; }

        /* When triggered, doors swing open */
        body.open-cabinet .cabinet-door.left {
            transform: rotateY(-90deg);
        }
        body.open-cabinet .cabinet-door.right {
            transform: rotateY(90deg);
        }

        .portal-container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: #1a1c1e;
            border: 4px solid var(--ikea-yellow);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 10;
        }
        h1 {
            font-size: 1.8rem;
            color: var(--ikea-yellow);
            margin-top: 0;
        }
        p {
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .cabinet-btn {
            background: var(--ikea-blue);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,81,186,0.4);
            transition: background 0.2s;
        }
        .cabinet-btn:hover {
            background: #003d8c;
        }
    </style>
</head>
<body>

    <!-- Cabinet Door Transition Overlay (Closed Gateway on Page 1) -->
    <div class="cabinet-overlay">
        <div class="cabinet-door left" onclick="openCabinetAndEnter()">
            <video autoplay muted loop playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-with-financial-data-31910-large.mp4" type="video/mp4">
            </video>
            <div class="cabinet-handle"></div>
        </div>
        <div class="cabinet-door right" onclick="openCabinetAndEnter()">
            <video autoplay muted loop playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-with-financial-data-31910-large.mp4" type="video/mp4">
            </video>
            <div class="cabinet-handle"></div>
        </div>
    </div>

    <div class="portal-container">
        <h1>The Modern Worldly Curiosity Shop</h1>
        <p>Step right through the cabinet doors to access candidate profiles, professional experience records, and live interactive terminals.</p>
        <button class="cabinet-btn" onclick="openCabinetAndEnter()">Open Cabinet &amp; Enter Seller Page</button>
    </div>

    <script>
        function openCabinetAndEnter() {
            document.body.classList.add('open-cabinet');
            setTimeout(() => {
                window.location.href = 'seller.html';
            }, 1100);
        }
    </script>

</body>
</html>
